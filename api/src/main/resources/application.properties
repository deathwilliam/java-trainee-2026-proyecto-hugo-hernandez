
spring.application.name=fincom

# Conexion a PostgreSQL

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fincom}
spring.datasource.username=${DB_USUARIO:banco}
spring.datasource.password=${DB_CLAVE:banco123}

# Configuracion de JPA e Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.hbm2ddl.import_files_sql_extractor=multi-line
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
spring.jpa.open-in-view=false
jwt.clave=${JWT_CLAVE}
